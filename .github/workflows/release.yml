name: Build and release YouTube Censor

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "patches-list.json"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested public-alpha package
        type: boolean
        default: false

concurrency:
  group: youtube-censor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check pure rules and reference timings
        run: |
          mkdir -p /tmp/censor-testclasses
          javac -encoding UTF-8 -d /tmp/censor-testclasses src/ProfanityRules.java src/ProfanitySchedule.java src/ProfanityChannels.java tests/ProfanityScheduleTest.java tests/ContentAngelTimingTest.java tests/ProfanityWordsTest.java tests/ProfanityChannelsTest.java
          java -cp /tmp/censor-testclasses app.morphe.extension.youtube.patches.ProfanityScheduleTest
          java -cp /tmp/censor-testclasses app.morphe.extension.youtube.patches.ContentAngelTimingTest tests/contentangel-word-timing.tsv
          java -cp /tmp/censor-testclasses app.morphe.extension.youtube.patches.ProfanityWordsTest
          python3 tests/run_word_editor_tests.py
          java -cp /tmp/censor-testclasses app.morphe.extension.youtube.patches.ProfanityChannelsTest
          python3 tests/run_channel_editor_tests.py
      - name: Fetch exact upstream source
        run: |
          git clone --depth 1 --branch v2.2.0 https://github.com/MorpheApp/morphe-patches.git upstream
          test "$(git -C upstream rev-parse HEAD)" = 44031c561ea048c8f196877f30a49c13bfd6afb6
      - name: Verify community discovery catalog
        run: python3 tools/generate_catalog.py upstream/patches-list.json --check
      - name: Apply independent YouTube Censor overlay
        run: python3 apply_to_morphe.py upstream
      - name: Check runtime and Android-local caption acquisition
        run: |
          python3 tests/run_runtime_tests.py upstream
          curl -fsSL --retry 2 https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json-host-tests.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/json-host-tests.jar' | sha256sum --check
          python3 tests/run_web_caption_tests.py upstream --json-jar /tmp/json-host-tests.jar
      - name: Build Android patch bundle
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --no-daemon
      - name: Prepare release and complete corresponding source
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/youtube-censor-source/overlay
          test "$(find upstream/patches/build/libs -maxdepth 1 -name '*.mpp' | wc -l)" -eq 1
          cp "$(find upstream/patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)" dist/youtube-censor.mpp
          cp LICENSE NOTICE dist/
          git archive HEAD | tar -x -C /tmp/youtube-censor-source/overlay
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties --exclude=__pycache__ -cf - upstream | tar -xf - -C /tmp/youtube-censor-source
          printf '%s\n' "Overlay commit: $GITHUB_SHA" 'Upstream commit: 44031c561ea048c8f196877f30a49c13bfd6afb6 (v2.2.0)' 'The upstream/ directory already has the overlay applied. See overlay/BUILDING.md.' > /tmp/youtube-censor-source/BUILD-IDENTITY.txt
          tar -czf dist/youtube-censor-corresponding-source.tar.gz -C /tmp youtube-censor-source
          cd dist
          sha256sum youtube-censor.mpp youtube-censor-corresponding-source.tar.gz LICENSE NOTICE > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-censor-release
          path: dist/*
          if-no-files-found: error
      - name: Publish public alpha
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.10.0
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          test "$tagged" = "$GITHUB_SHA" || { echo 'Create a lightweight release tag on this exact commit before dispatching.'; exit 1; }
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "YouTube Censor 0.10.0 - channel whitelist alpha" --prerelease --notes-file RELEASE_NOTES.md
